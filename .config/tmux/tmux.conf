set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

bind l send-keys 'C-l'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set-hook -g after-new-session 'rename-session "#{b:pane_current_path}"'
setw -g mode-keys vi
set -s escape-time 0

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
 
# ---- status bar: the orange strip --------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#f08a1c,fg=#15232f"
 
set -g status-left-length 40
set -g status-left "#[bg=#15232f,fg=#f08a1c,bold] #S #[bg=#f08a1c] "
 
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=#d0382b#,fg=#e6eef2#,bold] PREFIX #[default] ,}#[fg=#15232f]#h  %H:%M %d-%b "
 
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_flags,#F,} "
set -g window-status-current-format "#[bg=#15232f,fg=#f08a1c,bold] #I:#W#{?window_zoomed_flag, Z,} "
set -g window-status-activity-style "bg=#f08a1c,fg=#15232f,underscore"
set -g window-status-bell-style "bg=#d0382b,fg=#e6eef2,bold"
 
# ---- panes --------------------------------------------------------------
set -g pane-border-style "fg=#2a4259"
set -g pane-active-border-style "fg=#f08a1c"
set -g display-panes-colour "#5d7a92"
set -g display-panes-active-colour "#f08a1c"
 
# ---- messages, copy mode, popups ---------------------------------------
set -g message-style "bg=#15232f,fg=#f08a1c,bold"
set -g message-command-style "bg=#15232f,fg=#e6eef2"
set -g mode-style "bg=#34506b,fg=#e6eef2"
set -g copy-mode-match-style "bg=#d9a521,fg=#15232f"
set -g copy-mode-current-match-style "bg=#f08a1c,fg=#15232f,bold"
set -g popup-style "bg=#15232f,fg=#a9bccb"
set -g popup-border-style "fg=#f08a1c"
set -g menu-style "bg=#15232f,fg=#a9bccb"
set -g menu-selected-style "bg=#f08a1c,fg=#15232f"
set -g menu-border-style "fg=#f08a1c"
 
set -g clock-mode-colour "#f08a1c"
set -g clock-mode-style 24

run '~/.tmux/plugins/tpm/tpm'


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'christoomey/vim-tmux-navigator'

bind l send-keys 'C-l'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

set-hook -g after-new-session 'rename-session "#{b:pane_current_path}"'
set -g status-position top
set -g status-right "%H:%M"
setw -g mode-keys vi
set -s escape-time 0

# olive-crt (dark) — matches nvim colorscheme, from olive-crt.nvim/extras/tmux
set -g mode-style "fg=#1D211A,bg=#BCCD80"
set -g message-style "fg=#FBFCF6,bg=#1D211A"
set -g message-command-style "fg=#FBFCF6,bg=#1D211A"
set -g pane-border-style "fg=#99A293"
set -g pane-active-border-style "fg=#BCCD80"
set -g status-style "fg=#FBFCF6,bg=#1D211A"
set -g status-left-style "fg=#1D211A,bg=#BCCD80"
set -g status-right-style "fg=#FBFCF6,bg=#1D211A"
set -g window-status-style "fg=#99A293,bg=#1D211A"
set -g window-status-current-style "fg=#1D211A,bg=#ECF6AE"
set -g window-status-activity-style "fg=#1D211A,bg=#F7C775"
set -g window-status-bell-style "fg=#1D211A,bg=#EA938B"

run '~/.tmux/plugins/tpm/tpm'

